# Paste into Settings → Automations → (new) → ⋮ → Edit in YAML.
# Replace the webhook_id with something long and random, and the notify targets with yours
# (Developer tools → Actions → search "notify.mobile_app_" to see them).
alias: Ladd tickets open
mode: queued
triggers:
  - trigger: webhook
    webhook_id: ladd-CHANGE-ME-to-something-random
    allowed_methods: [POST]
    local_only: false   # GitHub calls in from the internet
actions:
  - action: notify.mobile_app_YOUR_PHONE
    data: &msg
      title: "{{ trigger.json.title }}"
      message: "{{ trigger.json.message }}"
      data:
        url: "{{ trigger.json.url }}"           # iOS: tap opens the event
        clickAction: "{{ trigger.json.url }}"   # Android: tap opens the event
        push:
          interruption-level: time-sensitive    # iOS: breaks through Focus
        priority: high                          # Android
        ttl: 0
  - action: notify.mobile_app_OTHER_PHONE
    data: *msg
  # Optional: something louder, e.g. a speaker announcement or flashing a light.
